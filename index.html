<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1718">
  <title>SSHHUIII — Temple Run</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-wrap">
    <canvas id="game" width="960" height="600" aria-label="SSHHUIII endless runner game"></canvas>

    <div class="hud" id="hud">
      <div class="brand">SSHHUIII</div>
      <div class="stats">
        <div class="stat"><span>SCORE</span><strong id="score">00000</strong></div>
        <div class="stat"><span>BEST</span><strong id="best">00000</strong></div>
        <div class="coin-stat"><span class="coin-icon"></span><strong id="coins">0</strong></div>
      </div>
    </div>

    <section class="overlay visible" id="menu">
      <div class="menu-card">
        <p class="kicker">AN ANCIENT ESCAPE</p>
        <h1>RUN<br><span>THE RUINS</span></h1>
        <p class="subtitle">The temple is awake. Don't look back.</p>
        <button id="playButton" class="play-button"><span>START RUN</span><b>→</b></button>
        <div class="controls">
          <span><kbd>←</kbd><kbd>→</kbd> MOVE</span>
          <span><kbd>↑</kbd> JUMP</span>
          <span><kbd>↓</kbd> SLIDE</span>
        </div>
      </div>
    </section>

    <section class="overlay" id="gameOver">
      <div class="menu-card game-over-card">
        <p class="kicker">THE RUINS CAUGHT YOU</p>
        <h2>RUN<br><span>ENDED</span></h2>
        <div class="result-row">
          <div><span>SCORE</span><strong id="finalScore">0</strong></div>
          <div><span>COINS</span><strong id="finalCoins">0</strong></div>
        </div>
        <button id="restartButton" class="play-button"><span>RUN AGAIN</span><b>↻</b></button>
      </div>
    </section>

    <button id="pauseButton" class="pause-button" aria-label="Pause game">Ⅱ</button>
  </main>
  <script src="game.js"></script>
</body>
</html>
